<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Three.js Test</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- Import Map para cargar Three.js directamente desde un CDN -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Escena y Cámara
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

        // 2. Renderizador
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 3. Un cubo simple
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0x5555ff, wireframe: false});
        const cube1 = new THREE.Mesh(geometry, material);
        // scene.add(cube1);


        // 3. otro cubo simple
        const geometry_2 = new THREE.BoxGeometry(1, 1, 1);
        const material_2 = new THREE.MeshBasicMaterial({ color: 0x111155, wireframe: false});
        const cube2 = new THREE.Mesh(geometry_2, material_2);
        scene.add(cube2);

        camera.position.z = 1.5;

        // 4. Bucle de animación
        function animate() {
            requestAnimationFrame(animate);


			// cube1.rotation.x -= 100.01;
            // cube1.rotation.y -= 100.01;

            cube2.rotation.x += 0.01;
            cube2.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        animate();

        // Ajustar si cambias el tamaño de la ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
