<!DOCTYPE html>
<html>
<head>
    <title>Mi primer proyecto three.js</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        var WIDTH = 400;
        var HEIGHT = 300;

        var VIEW_ANGLE = 50;
        var ASPECT = WIDTH / HEIGHT;
        var NEAR = 100;
        var FAR = 10000;

        var renderer = new THREE.WebGLRenderer(); 
        var camera = new THREE.PerspectiveCamera(VIEW_ANGLE, ASPECT, NEAR, FAR);
        var scene = new THREE.Scene();

        // 1. CUBO VERDE
        const geometry_cube = new THREE.BoxGeometry(100, 100, 100); // Le subí el tamaño para que se vea de lejos
        const material_cube = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cube_cube = new THREE.Mesh(geometry_cube, material_cube);
        
        // Movemos el cubo verde a la derecha para que no se superponga con el rojo
        cube_cube.position.x = 250; 
        scene.add(cube_cube);

        // 2. CUBO ROJO
        var geometry = new THREE.BoxGeometry(300, 300, 300);
        var material = new THREE.MeshBasicMaterial({ color: 0xff0000 }); 
        var cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 3. CÁMARA Y RENDERIZADOR
        camera.position.x = 0;
        camera.position.y = 0;
        camera.position.z = 1000;

        renderer.setSize(WIDTH, HEIGHT);
        document.body.appendChild(renderer.domElement);

        renderer.render(scene, camera);

        function animate()
        {

			cube.rotation.x += 0.005;
			cube.rotation.y += 0.01;

			renderer.render( scene, camera );

		}
    </script>
</body>
</html>
</body>
</html>
