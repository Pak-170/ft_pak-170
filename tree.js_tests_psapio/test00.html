<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rectángulo 2D Simple</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
    </style>
</head>
<body>

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Escena, Cámara y Renderizador básicos
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Crear un rectángulo plano (PlaneGeometry) en lugar de un cubo
        // Ancho: 2, Alto: 0.5
        const geometry = new THREE.PlaneGeometry(2, window.innerWidth / 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x0055ff, side: THREE.DoubleSide });
        const rectangle = new THREE.Mesh(geometry, material);
        scene.add(rectangle);

        rectangle.position.y = -2; // Posición abajo en la pantalla

        // 3. Control con el ratón
        let targetX = 0;

        window.addEventListener('mousemove', (event) => {
            // Normalizar la posición del ratón de -1 a 1
            const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            
            // Calcular el ancho visible de la cámara para que llegue a los extremos
            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const visibleHeight = 2 * Math.tan(vFOV / 2) * Math.abs(camera.position.z);
            const visibleWidth = visibleHeight * camera.aspect;
            
            // Mapear al movimiento (puedes ajustar el 1.5 si quieres más o menos rango)
            targetX = mouseX * (visibleWidth / 2) * 1.5; 
        });

        // 4. Bucle de animación suave
        function animate() {
            requestAnimationFrame(animate);

            // Interpolación (lerp) para suavizar el movimiento hacia el ratón
            rectangle.position.x += (targetX - rectangle.position.x) * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        // 5. Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
