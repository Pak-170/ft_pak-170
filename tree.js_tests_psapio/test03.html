<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rectángulo con fondo HTML y responsive</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; }
        canvas { display: block; }
        /* Imagen de fondo directa en HTML para evitar bloqueos del navegador */
#background-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Cambiado de 'cover' a 'contain' para que no se recorte */
            z-index: -1;
            background-color: #000; /* Fondo negro para los bordes que sobren */
        }
    </style>
</head>
<body>

    <!-- Tu imagen de fondo -->
    <img id="background-img" src="fondo.png" alt="Fondo">

    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
          }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Escena, Cámara y Renderizador transparente ({ alpha: true })
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 3); 
        camera.lookAt(0, 0, 0);

        // alpha: true hace que el canvas sea transparente y deje ver la foto del HTML de debajo
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Crear el rectángulo base y su borde negro
        const paddleGroup = new THREE.Group();

        const width = 1, height = 0.3, depth = 0.3;

        const geometry = new THREE.BoxGeometry(width, height, depth);
        const material = new THREE.MeshBasicMaterial({ color: 0x0055ff });
        const paddleMesh = new THREE.Mesh(geometry, material);
        paddleGroup.add(paddleMesh);

        const edges = new THREE.EdgesGeometry(geometry);
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 });
        const wireframe = new THREE.LineSegments(edges, lineMaterial);
        wireframe.position.z = 0.01; 
        paddleGroup.add(wireframe);

        scene.add(paddleGroup);
        paddleGroup.position.y = -4;

        // 3. Control de teclas y ratón
        const keys = { left: false, right: false };
        const speed = 1;
        let targetX = 3;

        window.addEventListener('mousemove', (event) => {
            const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const distanceToPaddle = Math.abs(camera.position.z - paddleGroup.position.z);
            const visibleHeight = 2 * Math.tan(vFOV / 2) * distanceToPaddle;
            const visibleWidth = visibleHeight * camera.aspect;
            targetX = mouseX * (visibleWidth / 2) * 1.4; 
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') keys.left = true;
            if (e.key === 'ArrowRight') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });

        // 4. Bucle principal de animación
        function animate() {
            requestAnimationFrame(animate);

            paddleGroup.position.x += (targetX - paddleGroup.position.x) * 0.3;

            if (keys.left) paddleGroup.position.x -= speed;
            if (keys.right) paddleGroup.position.x += speed;

            renderer.render(scene, camera);
        }

        animate();

        // 5. Adaptación dinámica a la ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
