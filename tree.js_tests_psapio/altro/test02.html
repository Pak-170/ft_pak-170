<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Mover rectángulo con flechas</title>
	<style>
		body { margin: 0; overflow: hidden; background: #111; }
		canvas { display: block; }
	</style>
</head>
<body>

	<script type="importmap">
		{
		  "imports": {
			"three": "https://unpkg.com/three@0.160.0/build/three.module.js"
		  }
		}
	</script>

	<script type="module">
		import * as THREE from 'three';

		// 1. Escena, Cámara y Renderizador
		const scene = new THREE.Scene();
		const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
		camera.position.z = 5;

		const renderer = new THREE.WebGLRenderer();
		renderer.setSize(window.innerWidth, window.innerHeight);
		document.body.appendChild(renderer.domElement);

		// 2. Crear el rectángulo (usamos PlaneGeometry o BoxGeometry estirada)
		// Ancho: 2, Alto: 0.5, Profundidad: 0.2
		const geometry = new THREE.BoxGeometry(2, 0.5, 0.2);
		const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
		const paddle = new THREE.Mesh(geometry, material);
		scene.add(paddle);

		// Posición inicial en pantalla
		paddle.position.y = -3;

		// 3. Control de teclas
		const keys = { left: false, right: false };
		const speed = 0.08; // Velocidad de movimiento

		window.addEventListener('keydown', (e) =>
		{
			if (e.key === 'ArrowLeft') keys.left = true;
			if (e.key === 'ArrowRight') keys.right = true;
		});

		window.addEventListener('keyup', (e) =>
		{
			if (e.key === 'ArrowLeft') keys.left = false;
			if (e.key === 'ArrowRight') keys.right = false;
		});

		// 4. Bucle principal de animación
		function animate()
		{
			requestAnimationFrame(animate);

			// Mover según la tecla pulsada
			if (keys.left)
			{
				paddle.position.x -= speed;
			}
			if (keys.right)
			{
				paddle.position.x += speed;
			}

			// Opcional: Limitar para que no salga de la pantalla
			const limit = 3.2;
			if (paddle.position.x < -limit) paddle.position.x = -limit;
			if (paddle.position.x > limit) paddle.position.x = limit;

			renderer.render(scene, camera);
		}

		animate();

		// Ajustar redimensionado
		window.addEventListener('resize', () =>
		{
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});
		
	</script>
</body>
</html>
